# Construit le launcher pour Windows, macOS et Linux.
# - à chaque push / pull request : vérification + artefacts téléchargeables depuis l'onglet Actions
# - sur un tag "v*" (ex. v1.0.1) : les fichiers sont aussi joints à une release GitHub (brouillon)
name: Build launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire
        shell: bash
        run: |
          # Le certificat Apple ne sert qu'au build macOS (sinon electron-builder l'utiliserait aussi
          # pour signer l'installateur Windows). Windows utilisera WIN_CSC_LINK s'il est fourni un jour.
          # Tant que package.json demande une signature ad hoc (build.mac.identity = "-"), le certificat
          # et la notarisation sont ignorés, même si les secrets existent.
          mac_identity=$(node -p "require('./package.json').build.mac.identity ?? ''")
          if [ "$RUNNER_OS" = "macOS" ] && [ "$mac_identity" != "-" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
          # Un secret absent arrive comme une chaîne vide, qu'electron-builder prendrait pour un
          # chemin de certificat (« not a file ») : on retire ces variables vides.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}${WIN_CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # Sans certificat, pas de notarisation possible : build non signé.
          if [ -z "${CSC_LINK:-}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi

          set +e
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Les journaux ne sont lisibles qu'une fois connecté à GitHub ; les annotations sont publiques.
            msg=$(grep -E '⨯|[Ee]rror|failed|denied|invalid' build.log | tail -8 | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=electron-builder::${msg:-échec sans message explicite}"
            exit "$status"
          fi
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Vérifier la signature macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(ls -d dist/mac-arm64/*.app | head -1)"
          sig=$(codesign -dv --verbose=2 "$app" 2>&1 | grep -E '^(Signature=|Authority=Developer ID Application|TeamIdentifier|Runtime Version)' | tr '\n' ' ' || true)
          gatekeeper=$(spctl --assess --type execute -vv "$app" 2>&1 | tr '\n' ' ' || true)
          valid=$(codesign --verify --deep --strict "$app" 2>&1 && echo "signature valide" || true)
          echo "::notice title=Signature macOS::${sig:-aucune signature} | ${valid:-signature INVALIDE} | Gatekeeper : ${gatekeeper}"

      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
